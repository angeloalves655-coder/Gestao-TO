<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Relatórios T.O. Simplificado</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #areaImpressao, #areaImpressao * { visibility: visible; }
            #areaImpressao { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col md:flex-row">

    <!-- BARRA LATERAL: LISTA DE PACIENTES (no-print remove da impressão) -->
    <aside class="w-full md:w-64 bg-white border-r border-slate-200 p-4 flex flex-col gap-4 no-print">
        <div class="border-b pb-2">
            <h2 class="text-xl font-bold text-teal-700">📋 Meus Pacientes</h2>
            <p class="text-xs text-slate-500">Selecione para gerenciar</p>
        </div>

        <!-- Campo rápido para adicionar novo paciente -->
        <div class="flex gap-2">
            <input type="text" id="novoPacienteNome" placeholder="Nome da criança..." class="w-full px-3 py-1.5 text-sm border rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500">
            <button onclick="adicionarPaciente()" class="bg-teal-600 hover:bg-teal-700 text-white px-3 py-1.5 rounded-xl font-bold text-sm">+</button>
        </div>

        <!-- Lista de Pacientes Cadastrados -->
        <div id="listaPacientes" class="flex flex-col gap-1 overflow-y-auto max-h-[300px] md:max-h-none flex-grow">
            <!-- Gerado dinamicamente pelo JavaScript -->
        </div>

        <!-- Campo da API Key do Gemini -->
        <div class="border-t pt-4">
            <label class="block text-xs font-semibold text-slate-500 mb-1">Chave API do Gemini:</label>
            <input type="password" id="apiKey" placeholder="Cole sua chave aqui" class="w-full px-3 py-1.5 text-xs border rounded-lg bg-amber-50/50 focus:outline-none">
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL: FORMULÁRIO E FORMATAÇÃO -->
    <main class="flex-grow p-4 md:p-8 grid grid-cols-1 lg:grid-cols-2 gap-6 no-print">
        
        <!-- Bloco de Entrada do Paciente Selecionado -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col gap-4">
            <div>
                <span class="text-xs font-bold uppercase tracking-wider text-teal-600">Paciente Selecionado</span>
                <h2 id="nomePacienteAtivo" class="text-2xl font-bold text-slate-800">Nenhum selecionado</h2>
            </div>

            <div class="flex-grow flex flex-col gap-2">
                <label class="block text-sm font-medium text-slate-600">Anotações de Evolução / Atividades do Ano:</label>
                <textarea id="anotacoes" rows="12" oninput="salvarDadosLocalmente()" placeholder="Digite o que a criança fez. Ex: Brincou muito na piscina de bolinhas, correu no circuito, teve dificuldade em amarrar o tênis sozinho mas aceitou ajuda do terapeuta." class="w-full flex-grow px-4 py-3 border rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none resize-none text-sm leading-relaxed"></textarea>
                <p class="text-xs text-slate-400">Suas anotações são salvas automaticamente ao digitar.</p>
            </div>

            <button onclick="gerarRelatorioIA()" id="btnGerar" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-medium py-3 rounded-xl transition duration-200">
                Gerar Relatório com IA
            </button>
        </div>

        <!-- Bloco de Saída do Relatório Pronto -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col">
            <h2 class="text-xl font-semibold text-slate-700 border-b pb-2 mb-4">Relatório Técnico Gerado (Editável)</h2>
            
            <textarea id="resultado" rows="14" placeholder="O relatório formatado profissionalmente aparecerá aqui..." class="w-full p-4 border rounded-xl focus:outline-none bg-slate-50 focus:bg-white resize-none text-sm leading-relaxed flex-grow mb-4"></textarea>

            <button onclick="window.print()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-3 rounded-xl transition duration-200">
                Imprimir ou Salvar em PDF
            </button>
        </div>
    </main>

    <!-- ÁREA DE IMPRESSÃO (Fica oculta na tela, só aparece no papel/PDF) -->
    <div id="areaImpressao" class="hidden print:block p-12 bg-white text-black">
        <div class="text-center border-b-2 border-slate-300 pb-4 mb-6">
            <h1 class="text-2xl font-bold uppercase tracking-wide">Relatório de Evolução em Terapia Ocupacional</h1>
            <p class="text-sm text-slate-500 mt-1">Acompanhamento Clínico e Desenvolvimento</p>
        </div>
        <div id="textoImprimir" class="whitespace-pre-wrap text-justify text-base leading-loose"></div>
    </div>

    <!-- PROGRAMAÇÃO DO APLICATIVO -->
    <script>
        let pacientes = JSON.parse(localStorage.getItem('to_pacientes')) || {};
        let pacienteAtivo = null;

        // Inicializar a lista ao carregar a página
        window.onload = function() {
            renderizarLista();
            const salvaKey = localStorage.getItem('to_gemini_key');
            if (salvaKey) document.getElementById('apiKey').value = salvaKey;
        };

        // Adicionar novo paciente na lista da esquerda
        function adicionarPaciente() {
            const input = document.getElementById('novoPacienteNome');
            const nome = input.value.trim();
            if (!nome) return;

            if (!pacientes[nome]) {
                pacientes[nome] = { anotacoes: "", relatorio: "" };
                localStorage.setItem('to_pacientes', JSON.stringify(pacientes));
                renderizarLista();
                selecionarPaciente(nome);
            }
            input.value = "";
        }

        // Desenhar a lista de botões dos pacientes
        function renderizarLista() {
            const container = document.getElementById('listaPacientes');
            container.innerHTML = "";

            Object.keys(pacientes).sort().forEach(nome => {
                const btn = document.createElement('button');
                btn.innerText = nome;
                btn.className = `w-full text-left px-3 py-2 rounded-xl text-sm font-medium transition duration-150 ${pacienteAtivo === nome ? 'bg-teal-50 text-teal-700 border border-teal-200' : 'text-slate-600 hover:bg-slate-100'}`;
                btn.onclick = () => selecionarPaciente(nome);
                container.appendChild(btn);
            });
        }

        // Mudar o paciente ativo na tela
        function selecionarPaciente(nome) {
            pacienteAtivo = nome;
            renderizarLista();

            document.getElementById('nomePacienteAtivo').innerText = nome;
            document.getElementById('anotacoes').value = pacientes[nome].anotacoes || "";
            document.getElementById('resultado').value = pacientes[nome].relatorio || "";
            document.getElementById('textoImprimir').innerText = pacientes[nome].relatorio || "";
        }

        // Salvar as anotações no navegador de forma automática
        function salvarDadosLocalmente() {
            if (!pacienteAtivo) return;
            pacientes[pacienteAtivo].anotacoes = document.getElementById('anotacoes').value;
            pacientes[pacienteAtivo].relatorio = document.getElementById('resultado').value;
            localStorage.setItem('to_pacientes', JSON.stringify(pacientes));
        }

        // Monitora edições diretas na caixa de resultado gerado
        document.getElementById('resultado').addEventListener('input', function(e) {
            document.getElementById('textoImprimir').innerText = e.target.value;
            salvarDadosLocalmente();
        });

        // Chamar o Gemini para transformar anotações simples em termos técnicos
        async function gerarRelatorioIA() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const anotacoes = document.getElementById('anotacoes').value;
            const btn = document.getElementById('btnGerar');
            const resultadoTextArea = document.getElementById('resultado');

            if (!pacienteAtivo) {
                alert("Por favor, selecione ou adicione um paciente na barra lateral primeiro!");
                return;
            }
            if (!anotacoes) {
                alert("Digite as anotações do paciente antes de gerar!");
                return;
            }
            if (!apiKey) {
                alert("Insira sua API Key do Gemini na barra lateral!");
                return;
            }

            localStorage.setItem('to_gemini_key', apiKey); // lembra a chave
            btn.disabled = true;
            btn.innerText = "IA redigindo relatório técnico...";
            resultadoTextArea.value = "Analisando dados do histórico clínico...";

            const promptContexto = `Você é um Terapeuta Ocupacional Pediátrico especialista em neurodesenvolvimento. Seu trabalho é transformar anotações simples de evolução em um relatório clínico formal, elaborado e rico em termos técnicos.
            
            Importante: Se nas anotações constar atividades lúdicas ou brinquedos comuns, traduza para o que foi estimulado clinicamente. 
            Exemplos de de-para obrigatórios:
            - "brincou na piscina de bolinhas" -> "estímulo do sistema proprioceptivo e somatosensorial, modulação tátil e organização do esquema corporal".
            - "andou na prancha / circuito balanceado" -> "treino de equilíbrio estático/dinâmico, reações de retificação e controle postural".
